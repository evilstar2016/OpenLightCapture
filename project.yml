name: OpenLightCapture
options:
  bundleIdPrefix: io.github.evilstar2016.openlightcapture
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions: [en, zh-Hans]
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGN_IDENTITY: "-"
    ENABLE_APP_SANDBOX: "NO"
    CLANG_ENABLE_MODULES: "YES"
targets:
  OpenLightCapture:
    type: application
    platform: macOS
    productName: OpenLightCapture
    sources:
      - path: LightCapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.evilstar2016.openlightcapture
        PRODUCT_NAME: OpenLightCapture
        PRODUCT_MODULE_NAME: LightCapture
        EXECUTABLE_NAME: OpenLightCapture
        INFOPLIST_FILE: LightCapture/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
  LightCaptureTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LightCaptureTests
    dependencies:
      - target: OpenLightCapture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.evilstar2016.openlightcapture.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OpenLightCapture.app/Contents/MacOS/OpenLightCapture"
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  OpenLightCapture:
    build:
      targets:
        OpenLightCapture: all
        LightCaptureTests: [test]
    test:
      targets:
        - LightCaptureTests
